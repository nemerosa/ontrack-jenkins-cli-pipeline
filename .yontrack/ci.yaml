version: v1
configuration:
  defaults:
    branch:
      autoVersioning: @.yontrack/auto-versioning.yaml
      validations:
        BUILD:
          tests:
            warningIfSkipped: true
        CHML:
          chml:
            warningLevel: HIGH
            warningValue: 1
            failedLevel: CRITICAL
            failedValue: 1
        PERCENTAGE:
          percentage:
            okIfGreater: false
            failureThreshold: 80
            warningThreshold: 50
        METRICS:
          metrics: { }
        GENERIC: { }
      promotions:
        BRONZE:
          validations:
            - BUILD
        SILVER:
          promotions:
            - BRONZE
          validations:
            - CHML
            - PERCENTAGE
            - METRICS
